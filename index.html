<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo's Cyber Journal</title>
<meta name="description" content="Notes, study logs, and lab write-ups from a Security+ certified beginner on the path to identity and access management.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<style>
:root{
  --paper:#F3F5FF; --surface:#FFFFFF; --ink:#141B34; --muted:#4F5A78; --line:#D6DBF5;
  --cobalt:#2740E6; --signal:#FFB300; --focus:#2740E6;
  --violet:#7A3FF2; --pink:#E8318C; --teal:#00A98F;
  --grad:linear-gradient(135deg,#2740E6 0%,#7A3FF2 55%,#E8318C 100%);
  --brand-grad:var(--grad);
  --band:#2740E6; --band-ink:#FFFFFF;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --text:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1020; --surface:#151B36; --ink:#EEF1FF; --muted:#A5AFD0; --line:#2B3463;
    --cobalt:#8FA6FF; --focus:#B3C2FF; --violet:#B38CFF; --pink:#FF73B8; --teal:#3FD9C1;
    --brand-grad:linear-gradient(135deg,#9DB2FF,#C4A4FF,#FF8CC4);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1020; --surface:#151B36; --ink:#EEF1FF; --muted:#A5AFD0; --line:#2B3463;
  --cobalt:#8FA6FF; --focus:#B3C2FF; --violet:#B38CFF; --pink:#FF73B8; --teal:#3FD9C1;
  --brand-grad:linear-gradient(135deg,#9DB2FF,#C4A4FF,#FF8CC4);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(60rem 28rem at 85% -6%,color-mix(in srgb,var(--violet) 22%,transparent),transparent 70%),radial-gradient(48rem 26rem at -8% 8%,color-mix(in srgb,var(--cobalt) 20%,transparent),transparent 70%),var(--paper);background-attachment:fixed;color:var(--ink);font-family:var(--text);font-size:1.0625rem;line-height:1.65}
a{color:inherit}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
#app{outline:none}

.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:.5rem .8rem;border:0;border-radius:6px;font:600 .95rem var(--display);z-index:10}
.skip:focus{left:.5rem;top:.5rem}

/* Header */
.site{display:flex;justify-content:space-between;align-items:center;gap:.75rem 1.5rem;flex-wrap:wrap;padding:1.25rem 0}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;text-decoration:none}
.nav{display:flex;gap:1.4rem;font-family:var(--display);font-size:.98rem;font-weight:500}
.nav a{text-decoration:none;color:var(--muted);padding:.2rem 0;border-bottom:3px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pink)}
.brand{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Hero */
.hero{display:grid;gap:2.75rem;align-items:center;padding:2.25rem 0 3.5rem}
@media (min-width:760px){.hero{grid-template-columns:1.25fr .75fr;gap:3.5rem;padding:3.5rem 0 4.5rem}}
.hero h1{font-family:var(--display);font-weight:750;font-size:clamp(2.3rem,6.4vw,3.7rem);line-height:1.03;letter-spacing:-.03em;margin:0 0 1.1rem}
.hero-copy p{font-size:1.2rem;line-height:1.55;max-width:33rem;color:var(--muted);margin:0 0 1.75rem}
.actions{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{font:600 .98rem var(--display);text-decoration:none;cursor:pointer;padding:.7rem 1.15rem;border-radius:10px;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.btn:hover{background:var(--surface)}
.btn{border-color:var(--cobalt);color:var(--cobalt)}
.btn:hover{background:color-mix(in srgb,var(--cobalt) 12%,transparent)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 24px -12px rgba(122,63,242,.7)}
.btn.primary:hover{opacity:.92;background:var(--grad)}

/* ID badge */
.badge-wrap{display:flex;justify-content:center}
.badge{width:100%;max-width:19rem;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transform:rotate(2deg);transform-origin:50% 0;box-shadow:0 24px 48px -24px rgba(122,63,242,.65)}
.badge-top{position:relative;background:var(--grad);color:var(--band-ink);padding:1.75rem 1.25rem 1rem;font:600 .95rem var(--display)}
.badge-top::before{content:"";position:absolute;top:.6rem;left:50%;width:3.2rem;height:.55rem;margin-left:-1.6rem;border-radius:99px;background:var(--paper)}
.badge-body{padding:1.25rem}
.avatar{width:4.5rem;height:4.5rem;border-radius:50%;background:linear-gradient(135deg,#FFB300,#FF7A59);color:#141B34;display:grid;place-items:center;font:800 2rem var(--display);margin-bottom:.9rem}
.badge h2{font:750 1.7rem/1.1 var(--display);letter-spacing:-.02em;margin:0}
.badge .role{color:var(--muted);font-size:1rem;line-height:1.4;margin:.2rem 0 1.1rem}
.facts{margin:0;display:grid;gap:.6rem}
.facts div{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-top:1px solid var(--line);padding-top:.6rem}
.facts dt{color:var(--muted);font-size:.92rem}
.facts dd{margin:0;font:600 .95rem var(--display);text-align:right}
.barcode{height:2.2rem;margin-top:1.2rem;opacity:.85;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px,var(--ink) 12px 13px,transparent 13px 16px)}
@media (prefers-reduced-motion: no-preference){
  .badge{animation:settle 1.5s cubic-bezier(.2,.9,.25,1) both}
}
@keyframes settle{
  0%{transform:rotate(-7deg) translateY(-16px)}
  45%{transform:rotate(4.5deg)}
  72%{transform:rotate(.8deg)}
  100%{transform:rotate(2deg)}
}

/* Journal list */
.section-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem 1.5rem;flex-wrap:wrap;margin-bottom:1rem}
.section-title{font:750 1.8rem var(--display);letter-spacing:-.02em;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{font:600 .9rem var(--display);border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:.35rem .85rem;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--violet);color:var(--violet)}
.chip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.entries{list-style:none;margin:0;padding:0 0 3rem}
.entry{display:grid;gap:.3rem;padding:1.5rem 1rem;border-top:1px solid var(--line);border-left:4px solid transparent;transition:border-color .2s,background .2s}
.entry:hover{border-left-color:var(--pink);background:color-mix(in srgb,var(--surface) 70%,transparent)}
@media (min-width:640px){.entry{grid-template-columns:9rem 1fr;gap:1.5rem}}
.entry time{color:var(--muted);font-size:.95rem;padding-top:.25rem}
.entry h3{font:650 1.4rem/1.2 var(--display);letter-spacing:-.015em;margin:0 0 .4rem}
.entry h3 a{text-decoration:none}
.entry h3 a:hover{text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:3px;text-underline-offset:5px}
.entry p{margin:0 0 .5rem;color:var(--muted)}
.tag{display:inline-block;font:600 .82rem var(--display);color:var(--violet);background:color-mix(in srgb,var(--violet) 14%,transparent);padding:.1rem .65rem;border-radius:99px}

/* Post */
.post{max-width:41rem;padding:1.5rem 0 4rem}
.back{font:600 .95rem var(--display);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink);text-decoration:underline}
.post h1,.page h1{font:750 clamp(2rem,5.2vw,2.9rem)/1.08 var(--display);letter-spacing:-.028em;margin:1.25rem 0 .75rem}
.meta{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;color:var(--muted);font-size:.98rem;margin-bottom:2rem}
.prose{font-size:1.2rem;line-height:1.72}
.prose p{margin:0 0 1.15rem}
.prose h3{font:650 1.3rem var(--display);letter-spacing:-.01em;margin:2rem 0 .6rem}
.prose ul{padding-left:1.3rem;margin:0 0 1.25rem}
.prose li{margin-bottom:.55rem;padding-left:.15rem}
.prose li::marker{color:var(--pink)}
.pager{display:grid;gap:1.25rem;border-top:1px solid var(--line);margin-top:3rem;padding-top:1.5rem}
@media (min-width:640px){.pager{grid-template-columns:1fr 1fr}.pager .older{text-align:right}}
.pager a{font:600 1.05rem/1.3 var(--display);text-decoration:none}
.pager a:hover{text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:3px;text-underline-offset:4px}
.pager small{display:block;color:var(--muted);font-weight:500;font-size:.85rem;margin-bottom:.15rem}


/* Lab post: tables, status cards, diagrams */
.prose h4{font:650 1.12rem var(--display);letter-spacing:-.005em;margin:1.6rem 0 .5rem}
.prose ol{padding-left:1.4rem;margin:0 0 1.25rem}
.prose{overflow-wrap:anywhere}
.prose code{font:500 .85em ui-monospace,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--cobalt) 12%,transparent);padding:.08em .38em;border-radius:5px}
.prose pre.tree{margin:0;overflow-x:auto;font:400 .88rem/1.7 ui-monospace,Menlo,Consolas,monospace}
.prose .scroll{overflow-x:auto;margin:1.2rem 0 1.5rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prose table{border-collapse:collapse;width:100%;min-width:34rem;font:500 .92rem/1.45 var(--display)}
.prose th,.prose td{text-align:left;padding:.7rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
.prose th{font:600 .74rem var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prose tr:last-child td{border-bottom:0}
.prose td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
.prose .matrix td:first-child{font-weight:700;white-space:nowrap}
.prose .matrix small{display:block;margin-top:.35rem;color:var(--muted);font-weight:400;font-size:.8rem}
.prose .p-full,.prose .p-lim,.prose .p-none{font:700 .72rem var(--display);letter-spacing:.06em;text-transform:uppercase;padding:.25rem .5rem;border-radius:6px;display:inline-block}
.prose .p-full{background:color-mix(in srgb,var(--cobalt) 16%,transparent);color:var(--cobalt)}
.prose .p-lim{background:color-mix(in srgb,var(--signal) 26%,transparent);color:var(--ink)}
.prose .p-none{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.prose .callout{border:1px solid var(--line);border-left:4px solid var(--violet);background:var(--surface);padding:.9rem 1.1rem;margin:1.4rem 0;border-radius:0 10px 10px 0;font-size:1.05rem}
.prose .callout p{margin:0}
.prose .callout strong{display:block;font:700 .75rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--violet);margin-bottom:.3rem}
.prose .status,.prose .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;margin:1.3rem 0}
.prose .cards.four{grid-template-columns:repeat(auto-fit,minmax(12rem,1fr))}
.prose .status>div,.prose .cards>div{border:1px solid var(--line);background:var(--surface);padding:1rem 1.1rem;border-radius:12px;min-width:0}
.prose .status .plan{border-style:dashed}
.prose .status h4{margin:0 0 .6rem;font:700 .75rem var(--display);letter-spacing:.1em;text-transform:uppercase}
.prose .status .done h4{color:var(--cobalt)}
.prose .status .plan h4{color:var(--muted)}
.prose .status ul{margin:0;padding-left:1.1rem;font-size:1rem}
.prose .status li{margin-bottom:.35rem}
.prose .cards h4{margin:0 0 .4rem;color:var(--cobalt);font-size:1rem}
.prose .cards p{margin:0;font-size:.98rem;color:var(--muted);line-height:1.55}
.prose .diagram{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:.5rem}
.prose .diagram svg{display:block;width:100%;min-width:40rem;height:auto}
.prose figure{margin:1.6rem 0}
.prose figcaption{font-size:.95rem;color:var(--muted);margin-top:.7rem;line-height:1.55}
.prose figcaption b{color:var(--ink)}
.prose .legend{display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:.7rem;font:500 .85rem var(--display);color:var(--muted)}
.prose .legend i{display:inline-block;width:1.6rem;height:.85rem;vertical-align:-1px;margin-right:.45rem;border:2px solid var(--cobalt);border-radius:3px}
.prose .legend i.d{border:2px dashed var(--muted)}
.prose svg text{font-family:var(--display);fill:var(--ink)}
.prose .t-sm{font-size:11px}
.prose .t-md{font-size:13.5px;font-weight:650}
.prose .t-lg{font-size:16px;font-weight:750}
.prose .t-badge{font-size:9.5px;letter-spacing:.09em;font-weight:600}
.prose .fill-done{fill:var(--paper);stroke:var(--cobalt);stroke-width:1.8}
.prose .fill-root{fill:color-mix(in srgb,var(--cobalt) 16%,var(--paper));stroke:var(--cobalt);stroke-width:2.2}
.prose .fill-plan{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}
.prose .link{stroke:var(--line);stroke-width:1.8;fill:none}
.prose .link-plan{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:4 4}
.prose svg .c-acc{fill:var(--cobalt)}
.prose svg .c-plan,.prose svg .c-mut{fill:var(--muted)}
.prose .proposed{border:2px dashed var(--violet);background:var(--surface);padding:1.1rem 1.2rem;margin:1.4rem 0;border-radius:12px}
.prose .proposed .flag{display:block;font:700 .74rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--violet);margin-bottom:.8rem}
.prose pre.tree .g{color:var(--violet);font-weight:600}
.prose pre.tree .d{color:var(--muted)}
.prose .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.prose .chips span{font:600 .82rem ui-monospace,Menlo,Consolas,monospace;border:1.5px dashed var(--violet);color:var(--violet);padding:.35rem .6rem;border-radius:8px}
.prose ol.next li{margin-bottom:.45rem}

/* Roadmap and About */
.page{max-width:42rem;padding:1.5rem 0 4rem}
.page .lede{font-size:1.2rem;color:var(--muted);margin:0}
.steps{list-style:none;margin:2.25rem 0 0;padding:0}
.step{position:relative;padding:0 0 2.1rem 2.4rem}
.step::before{content:"";position:absolute;left:calc(.575rem - 1px);top:1.5rem;bottom:.1rem;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{position:absolute;left:0;top:.2rem;width:1.15rem;height:1.15rem;border-radius:50%;border:2px solid var(--muted);background:var(--paper)}
.step[data-status="progress"] .dot{border-color:var(--signal);background:var(--signal)}
.step[data-status="done"] .dot{border-color:var(--teal);background:var(--teal)}
.step h3{font:650 1.25rem/1.3 var(--display);letter-spacing:-.01em;margin:0}
.status{display:inline-block;font:600 .8rem var(--display);padding:.1rem .6rem;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);margin-left:.6rem;vertical-align:.1rem;white-space:nowrap}
.step[data-status="progress"] .status{background:var(--signal);border-color:var(--signal);color:#16212C}
.step[data-status="done"] .status{background:var(--teal);border-color:var(--teal);color:#06231E}
.when{margin:.15rem 0 .4rem;color:var(--violet);font:600 .92rem var(--display)}
.step p{margin:0;color:var(--muted)}
.page .prose p{color:inherit}

.contact-card{margin-top:1.5rem;padding:1.5rem;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 40px -28px rgba(122,63,242,.6)}
.contact-card .email{display:inline-block;font:700 1.25rem var(--display);text-decoration:none;color:#fff;background:var(--grad);padding:.7rem 1.2rem;border-radius:12px;word-break:break-all}
.contact-card .email:hover{opacity:.9}
.contact-card .linkedin{display:inline-block;margin-top:.8rem;font:700 1.1rem var(--display);text-decoration:none;color:#fff;background:#0A66C2;padding:.7rem 1.2rem;border-radius:12px}
.contact-card .linkedin:hover{opacity:.9}
.contact-card .label{margin:1.1rem 0 .2rem}
footer a{color:var(--cobalt);font-weight:600}
/* Skills */
.skills{margin-top:2.5rem}
.skills h2{font:750 1.6rem var(--display);letter-spacing:-.02em;margin:0 0 1rem}
.skill-group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin-bottom:.9rem}
.skill-group h3{font:700 1rem var(--display);margin:0 0 .6rem;color:var(--violet)}
.skill-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.45rem}
.skill-list li{font:600 .9rem var(--display);padding:.3rem .8rem;border-radius:99px;background:color-mix(in srgb,var(--cobalt) 12%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--cobalt) 25%,transparent)}

/* Mobile */
html,body{overflow-x:hidden}
.btn,.chip,.nav a{touch-action:manipulation}
@media (max-width:639px){
  .wrap{padding:0 1rem}
  .site{padding:1rem 0 .5rem}
  .nav{gap:0 1.25rem;flex-wrap:wrap;width:100%}
  .nav a{padding:.7rem 0;min-height:44px;display:inline-flex;align-items:center}
  .btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center}
  .actions .btn{flex:1 1 auto}
  .hero{padding:1.25rem 0 2.5rem;gap:2rem}
  .badge-wrap{padding:0 .5rem}
  .section-head{display:block}
  .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scroll-padding:0 1rem;margin:.5rem -1rem 0;padding:.25rem 1rem .75rem;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-height:44px;padding:.5rem 1.05rem;scroll-snap-align:start;white-space:nowrap}
  .entry{padding:1.25rem .5rem}
  .entry time{padding-top:0}
  .prose{font-size:1.1rem}
  .contact-card{padding:1.1rem}
  .contact-card .email{font-size:1.05rem;display:block;text-align:center;padding:.85rem 1rem}
  .contact-card .linkedin{display:block;text-align:center}
  .step{padding-left:2rem}
  .status{margin-left:0;margin-top:.3rem;display:table}
  footer{padding-bottom:2rem}
}

footer{border-top:3px solid transparent;border-image:var(--grad) 1;padding:1.5rem 0 3rem;color:var(--muted);font-size:.95rem}
.credly-wrap{margin-top:14px}.credly-wrap iframe{max-width:100%;border:0}
</style>
</head>

<script>
/* ------------------------------------------------------------------
   CONTENT
   Newest post goes first in POSTS. Each post has a slug, title, date
   (YYYY-MM-DD), tag, one-line summary, and an HTML body.
------------------------------------------------------------------- */
const POSTS = [
  {
    slug: 'iam-lab-powershell-and-duo-mfa',
    title: 'Hands-On IAM Lab: Local Accounts in PowerShell and MFA Controls in Duo',
    date: '2026-11-10',
    tag: 'Home lab',
    summary: "Today's lab was all about identity: who has access, and how that access is protected. I audited local accounts with PowerShell, then worked through users, groups, and MFA policy layers in the Duo Admin Panel.",
    body: `
  <p>Today's lab was all about identity: who has access, and how that access is protected.</p>
  <p>I started in my Windows VM with PowerShell. I pulled system information, ran <code>Get-LocalUser</code> to see every local account, then filtered for the enabled ones with <code>Where-Object</code>. Knowing which accounts are active is one of the first steps in reducing risk.</p>
  <p>Then I moved into the Duo Security Admin Panel. I confirmed a user's Duo Mobile device showed Active status, created a test user named Jordan Smith, built an IT-Department group, and added Jordan to it. Then I checked the group membership and authentication status.</p>
  <p>I also looked at an existing RDP integration and compared Duo's three policy layers: Global, Application, and Application Group. The big takeaway was seeing how MFA rules can go from organization-wide defaults down to specific groups, so sensitive systems like remote desktop stay locked down.</p>

    tag: 'Project',
    summary: "For the past few months I've been building my new app, and it's getting close. We tested with users across Georgia and Florida, and security was a priority from day one: Cloudflare, app attestation, SSO, role-based access control, and change management. The app is submitted and waiting on review.",
    body: `
  <p>For the past few months I've been building my new app, and it's getting close.</p>
  <p>We recently ran tests with users across Georgia and Florida, and I'm happy with the results so far. Every round of feedback goes into a feedback-loop survey, so each update is shaped by real users.</p>

  <h3>Security was a priority from day one</h3>
  <ul>
    <li><strong>Cloudflare</strong> protecting the app and its traffic</li>
    <li><strong>App attestation</strong> on Android and Apple, so only the genuine, untampered app can talk to the backend</li>
    <li><strong>Google sign-in (SSO)</strong> submitted and awaiting Google's approval</li>
    <li><strong>Role-based access control:</strong> admins and users each get only the access their role needs</li>
    <li><strong>Change management:</strong> every system change is documented, so there's a record and a clear path to roll back if needed</li>
  </ul>

  <h3>Using AI, with guardrails</h3>
  <p>I also used AI to help with coding, inside clear guardrails. I set parameters for what it could and couldn't touch, and I wrote statements of work (SOWs) for each round of revisions based on what testing showed.</p>

  <h3>Security+ in practice</h3>
  <p>Least privilege, access control and change management aren't just Security+ exam topics for me anymore. They're built into something real people are using.</p>
  <p>The app is submitted and waiting on review. Launch is coming soon.</p>
`

  {
    slug: 'ad-users-and-security-groups',
    title: 'Building Identity From the Ground Up: Users and Security Groups in Active Directory',
    date: '2026-11-08',
    tag: 'IAM',
    summary: "Before you can manage access, you need identities to manage. I watched a short walkthrough on creating users and security groups in Windows Server, covering OUs, account options, group nesting, and logon hours. Here's what it showed, what I'm taking from it for Security+ and IAM, and what I'm building next.",
    body: `
  <p>Before you can manage access, you need identities to manage. Today I watched a short walkthrough from the bg official channel on creating users and security groups in Windows Server. It's basic and hands-on, but it covers the building blocks behind most access decisions in a Windows domain.</p>

  <h3>Where the work happens</h3>
  <p>Everything starts in Server Manager. Under Tools, open Active Directory Users and Computers, the console that lists the domain's existing users and security groups. The video says the process works on any version of Windows Server.</p>

  <h3>Organizational Units come first</h3>
  <p>Before creating anyone, the presenter right-clicks the domain and creates a new Organizational Unit (OU). His explanation: think of an OU as a folder where you keep things. Users and groups then get created inside it.</p>

  <h3>Creating a user</h3>
  <p>Right-click the OU, choose New &gt; User, and enter first name, last name and logon name. (A toolbar icon does the same thing.) Then set a password and choose account options:</p>
  <ul>
    <li>User must change password at next logon</li>
    <li>User cannot change password</li>
    <li>Password never expires</li>
    <li>Account is disabled</li>
  </ul>
  <p>He picks "must change password at next logon." Then the first password gets rejected for not meeting the password requirements, so he sets a more complex one and the account is created.</p>

  <h3>Security groups and nesting</h3>
  <p>Right-click, choose New &gt; Group, name it and set the type to Security. To add members, open the group's Properties, go to Members, click Add, type the user's name and hit Check Names to confirm the account exists.</p>
  <p>He also creates a second group, Sales, and adds it as a member of an existing accounts group. Groups can contain groups, not just users.</p>

  <h3>User properties worth knowing</h3>
  <p>A user's Properties include:</p>
  <ul>
    <li><strong>Member Of:</strong> the groups they belong to</li>
    <li><strong>Address:</strong> contact details</li>
    <li><strong>Account:</strong> logon name, account options (including storing the password using reversible encryption) and logon hours</li>
  </ul>
  <p>For logon hours, he restricts a user to logging in only on Sunday.</p>

  <h3>What I'm taking from this</h3>
  <p>I already passed Security+, and now I'm working toward IAM. This connected the vocabulary I studied to actual clicks.</p>
  <p><strong>Account options are policy decisions.</strong> "Must change password at next logon" means the admin who created the account doesn't keep knowing the password. "Password never expires" and reversible encryption are settings I'd question in an audit, not turn on by default.</p>
  <p><strong>Groups are how access scales.</strong> Grant permissions to a group and let membership decide who gets them; that's the core of role-based access. Nesting is powerful, but it can also hide who really has access, which is why access reviews matter.</p>
  <p><strong>Logon hours are a small but real control.</strong> Limiting when an account can sign in shrinks the window someone could misuse it.</p>
  <p>Next up in my directory lab, I'm scaling this up: an OU with at least 150 users and 9 groups, structured in more detail and driven by who actually needs access to what. I don't want to click through 150 accounts by hand, so I'm learning PowerShell, and my goal is to have the whole process automated with PowerShell scripts by this Saturday. I'll document the build here.</p>
`
  },

  <h4>The server and the domain</h4>
  <p>I set up a Windows Server virtual machine in VirtualBox, made it a domain controller, and named it <code>DC01</code>. A domain controller is the server that answers the question "who are you, and are you allowed in?" for everything in the domain. I created the Active Directory domain <code>MOISE.LAB</code> on it.</p>

  <h4>Users, OUs and a simulated healthcare organization</h4>
  <p>With the domain up, I worked with Active Directory users and Organizational Units. An OU is a container that groups related objects, such as the people in one department, so they can be managed together. I used this to build a fictional organization called <strong>Atlanta Medical</strong>. So far it has two departments, Human Resources and IT, and I created the staff accounts for each inside my directory.</p>
  <p>I chose a healthcare setting on purpose. Healthcare IT is where I want to end up, and it is a good setting for learning access control because different roles need very different levels of access to sensitive information.</p>

  <h4>Looking at the network adapters</h4>
  <p>Next I opened the network adapters on the server to understand how it connects to things. The VM has two virtual adapters:</p>

    <thead><tr><th>Adapter</th><th>VirtualBox mode</th><th>IPv4 address</th><th>Subnet mask</th><th>Default gateway</th></tr></thead>

  <p>Here is how I understand the four settings I was reading:</p>
  <ul>
    <li><strong>IPv4 address:</strong> the machine's address on a network.</li>
    <li><strong>Subnet mask:</strong> tells the machine which addresses are on its own local network. With <code>255.255.255.0</code>, everything that starts <code>192.168.10.</code> is local.</li>
    <li><strong>Default gateway:</strong> where traffic goes when the destination is outside the local network. The NAT adapter has one (<code>10.0.2.2</code>), which is how the VM reaches the internet through my Mac.</li>
    <li><strong>DNS:</strong> the system that turns names into addresses, covered next.</li>
  </ul>
  <p>The second adapter, on the internal network, has no default gateway. As I read it, that makes it a closed lab network: machines on it can talk to each other, but it has no route out. That is the network where future lab machines will find <code>DC01</code>.</p>

  <h4>DNS Manager and the MOISE.LAB zone</h4>
  <p>I then opened DNS Manager and located the <code>MOISE.LAB</code> Forward Lookup Zone. Inside it I found the Host (A) record for <code>DC01</code> and confirmed that it points to <code>192.168.10.10</code>, the address on the internal adapter. An A record is a simple entry that says "this name lives at this address."</p>

  <h4>Why DNS matters so much for Active Directory</h4>
  <p>Before today I thought of DNS as "the thing that makes websites work." In Active Directory it is closer to the phone book the whole domain depends on. When a computer joins the domain or a user signs in, the computer first has to find a domain controller, and it does that through DNS. Active Directory also publishes service (SRV) records there so clients can locate the services a domain controller offers. I only looked at the A record today, and I haven't explored the SRV records yet.</p>
  <p>If DNS gives the wrong answer, or the client is pointed at the wrong DNS server, authentication can fail even when the accounts and passwords are perfectly fine. That is why I wanted to confirm the record points to the right address before building anything else on top of it.</p>

  <h3>How this connects to real-world IAM</h3>
  <p>Identity and Access Management is the discipline of making sure the right people have the right access, to the right things, for the right reasons. A directory like Active Directory is where that identity information lives, so this lab touches the basics of IAM directly.</p>
  <div class="cards">
    <div><h4>User provisioning</h4><p>Creating an account when someone joins, putting it in the right place, and removing or disabling it when they leave. I practiced the creation side today.</p></div>
    <div><h4>Organizational Units</h4><p>Structure that mirrors the organization, so each department's users can be found and managed together.</p></div>
    <div><h4>Security groups</h4><p>Collections of users that permissions are assigned to. Add a person to a group and they receive that group's access.</p></div>
    <div><h4>RBAC</h4><p>Role-Based Access Control. Access follows the person's job role, so a nurse gets nurse access because of the role, not because someone hand-picked each permission.</p></div>
    <div><h4>Least privilege</h4><p>Everyone gets the minimum access needed to do their job, and no more. It limits the damage when an account is misused or compromised.</p></div>
    <div><h4>Department-based permissions</h4><p>Combining OUs, groups and RBAC so that access lines up with how the organization is actually divided.</p></div>
  </div>

  <h4>Why people should only get what their job requires</h4>
  <p>Healthcare organizations hold some of the most sensitive information there is. A person with extra access is extra risk: a curious employee, a stolen password, or a simple mistake can expose records that never needed to be reachable by that account. Limiting access shrinks what an attacker can reach through any one account, and it makes mistakes less costly.</p>
  <p>In the United States, the HIPAA "minimum necessary" idea points the same way: use or see only the amount of patient information needed for the task. I'm early in learning the compliance side, so I'm treating this as the reason behind the technical design, not as something my lab satisfies.</p>
  <p>The IT administrator row is the one I find most interesting. Someone can have full control of the servers and still have no reason to read patient charts. Keeping those two things separate is a real design decision, and I want to understand it better as I go.</p>

    <li>OUs are about structure and management. Security groups are about access. They work together but they are not the same thing.</li>

    body: `
      <p>Identity and access management sounds complicated, but it comes down to two questions. Who are you? And what are you allowed to do? Everything else is how a company answers those at scale.</p>
      <p>A note: I'm still studying IAM, so this is what I understand so far. I'll keep adding to it as I learn.</p>
      <h3>The core pieces</h3>
      <p><strong>Authentication</strong> proves who you are. It can use something you know (a password), something you have (an app code or security key), or something you are (a fingerprint). Multifactor authentication combines at least two of those.</p>
      <p><strong>Authorization</strong> decides what you can do once you're in. Two common models: role-based access control (RBAC), where access comes from your job role, and attribute-based access control (ABAC), where it depends on things like department, device, or location.</p>
      <p><strong>Least privilege</strong> means people only get the access they need to do their job. It's the main reason I care about getting group and permission design right.</p>
      <p><strong>Joiner-mover-leaver</strong> is the lifecycle. When someone joins, they get the right accounts. When they move roles, access changes. When they leave, everything is removed quickly. Old access that never got removed is one of the most common security problems.</p>
      <p><strong>Privileged access management (PAM)</strong> protects admin accounts with things like vaulting, just-in-time access, and session recording.</p>
      <h3>How the protocols fit</h3>
      <p><strong>Kerberos</strong> is how Active Directory logs you in. You prove who you are to the domain controller and get a ticket-granting ticket. You then use that ticket to request a ticket for each service you need, so your password never travels across the network. It's also sensitive to time, and clocks that drift too far apart break it.</p>
      <p><strong>LDAP</strong> is how apps look things up in a directory. <strong>SAML</strong> uses signed XML assertions so an identity provider (like Okta or Entra ID) can log you into other apps with single sign-on. <strong>OAuth 2.0</strong> is about delegated access, letting an app act for you with a token without getting your password. <strong>OpenID Connect</strong> adds an ID token on top of OAuth so apps can also know who you are.</p>
      <h3>Why I started with networking</h3>
      <p>On September 8 I realized I couldn't really understand any of this without the network underneath it. So I built a networking guide just for IAM work: IP addressing, DNS, common ports (389 for LDAP, 636 for LDAPS, 88 for Kerberos), and how traffic moves between a user, a domain controller, and an app.</p>

    `

    summary: 'I spent the first four days of September on Domain 1, General Security Concepts, which is 12% of the exam. It covers security controls, the CIA triad, AAA, and zero trust. It also covers honeypots, change management, and cryptography with PKI. Everything else in the exam builds on these ideas.',
    body: `
      <p>I spent the first four days of September on Domain 1, General Security Concepts. It's only 12% of the exam, but everything else builds on it.</p>
      <h3>Controls</h3>
      <p>Security controls have four categories (technical, managerial, operational, physical) and six types (preventive, deterrent, detective, corrective, compensating, directive). The way I keep them straight is that the category is what a control is made of and the type is its job. A security camera is a physical control that works as detective and deterrent.</p>
      <h3>The big ideas</h3>
      <p>The CIA triad is confidentiality, integrity, and availability. AAA is authentication, authorization, and accounting. Non-repudiation means nobody can deny what they did, which is what digital signatures and logs give you.</p>
      <p>Zero trust means never trust, always verify, even inside the network. It splits into a control plane that decides who gets access and a data plane that enforces it. Gap analysis compares where you are to where a standard says you should be.</p>
      <h3>Physical, deception, and change</h3>
      <p>Layers beat any single lock: fences, bollards, cameras, and access vestibules. Honeypots, honeynets, honeyfiles, and honeytokens are fakes built to catch attackers. They're my favorite part of this domain. Change management always needs approval, impact analysis, testing, a backout plan, and a maintenance window.</p>
      <h3>Cryptography</h3>
      <p>I expected this to be the hardest part. Symmetric encryption uses one shared key and is fast (AES). Asymmetric uses a public and private key pair (RSA), and it's slower, so it's often used to exchange a symmetric key. Hashing is a one-way fingerprint for checking integrity (SHA-256), and salting stops identical passwords from producing identical hashes. A digital signature is a hash signed with a private key, which proves who sent something and that it wasn't changed.</p>
      <p>PKI is what makes the keys trustworthy. A certificate authority signs certificates so you can trust that a public key belongs to the website or person it claims to.</p>
    `

/* ------------------------------------------------------------------
   ROUTER
------------------------------------------------------------------- */
let currentPath = location.hash;
function route() {
  const [view, arg] = currentPath.replace(/^#\/?/, '').split('/');
  let html, title = "Mo's Cyber Journal", nav = 'journal';

  if (view === 'post') {
    const r = postView(arg);
    html = r.html; title = r.title + " | Mo's Cyber Journal";
  } else if (view === 'roadmap') {
    html = roadmapView(); nav = 'roadmap'; title = "Roadmap | Mo's Cyber Journal";
  } else if (view === 'contact') {
    html = contactView(); nav = 'contact'; title = "Contact | Mo's Cyber Journal";
  } else if (view === 'about') {
    html = aboutView(); nav = 'about'; title = "About | Mo's Cyber Journal";
  } else {
    html = homeView();
  }

  app.innerHTML = html;
  if (view === 'about') {
    try { var cs = document.createElement('script'); cs.async = true; cs.src = '//cdn.credly.com/assets/utilities/embed.js'; document.body.appendChild(cs); } catch (e) {}
  }
  document.title = title;
  document.querySelectorAll('.nav a').forEach(a => {
    if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  if (!firstLoad) app.focus({ preventScroll: true });
  firstLoad = false;
}

document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#/"]');
  if (link && !e.defaultPrevented && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
    e.preventDefault();
    const h = link.getAttribute('href');
    currentPath = h;
    try { if (location.hash !== h) location.hash = h; } catch (err) {}
    route();
    return;
  }
  const chip = e.target.closest('.chip');
  if (chip) {
    activeTag = chip.dataset.tag;
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.tag === activeTag));
    document.getElementById('entries-list').innerHTML = entriesHTML();
    return;
  }
  const scroller = e.target.closest('[data-scroll]');
  if (scroller) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.getElementById(scroller.dataset.scroll).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
    return;
  }
  if (e.target.closest('[data-skip]')) app.focus();
});

window.addEventListener('hashchange', () => { if (location.hash !== currentPath) { currentPath = location.hash; route(); } });
route();
</script>
